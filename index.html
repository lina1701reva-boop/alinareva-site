<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alina Reva</title>
    <meta name="description" content="Alina Reva — музыка и ссылки" />
    <link rel="canonical" href="https://alinareva.com/" />

    <!-- Open Graph (красивое превью при отправке ссылки в мессенджерах) -->
    <meta property="og:title" content="Alina Reva" />
    <meta property="og:description" content="Моя музыка и ссылки" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://alinareva.com/" />

    <!-- favicon: буквы AR в кружке -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23e01030'/><text x='16' y='22' font-size='15' font-weight='bold' font-family='sans-serif' fill='white' text-anchor='middle'>AR</text></svg>"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- анимированный фон + парящие пятна -->
    <div class="bg" aria-hidden="true"></div>
    <div class="blob blob-1" aria-hidden="true"></div>
    <div class="blob blob-2" aria-hidden="true"></div>

    <main class="wrap">
      <!-- профиль -->
      <section class="profile">
        <!-- ФОТО: замени букву на своё фото — положи файл avatar.jpg рядом и
             раскомментируй строку <img>, а <span> удали -->
        <div class="avatar">
          <img src="avatar.jpg" alt="Alina Reva" />
        </div>

        <h1 class="name">Alina Reva</h1>
        <p class="tagline">Singer and songwriter of spicy songs</p>

        <!-- соцсети -->
        <div class="socials">
          <a class="social" href="https://www.instagram.com/alina_revaa" aria-label="Instagram" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="3" width="18" height="18" rx="5" />
              <circle cx="12" cy="12" r="4" />
              <circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none" />
            </svg>
          </a>
          <a class="social" href="https://t.me/alina_revaa" aria-label="Telegram" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M21.8 4.3 2.9 11.6c-.9.4-.9 1.6.1 1.9l4.7 1.5 1.8 5.6c.2.7 1.1.9 1.6.3l2.6-2.6 4.7 3.5c.7.5 1.6.1 1.8-.7l3-14.2c.2-1-.7-1.9-1.7-1.6zM9.7 14.3l8.2-5.1c.2-.1.4.2.2.4l-6.7 6.1c-.2.2-.4.5-.4.8l-.2 2.2-1.3-4.4z" />
            </svg>
          </a>
          <a class="social" href="https://www.youtube.com/@alina_revaa" aria-label="YouTube" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M23 12s0-3.2-.4-4.7a2.5 2.5 0 0 0-1.8-1.8C19.2 5 12 5 12 5s-7.2 0-8.8.5A2.5 2.5 0 0 0 1.4 7.3C1 8.8 1 12 1 12s0 3.2.4 4.7a2.5 2.5 0 0 0 1.8 1.8C4.8 19 12 19 12 19s7.2 0 8.8-.5a2.5 2.5 0 0 0 1.8-1.8C23 15.2 23 12 23 12zM9.8 15.3V8.7l5.7 3.3-5.7 3.3z" />
            </svg>
          </a>
          <a class="social" href="https://www.tiktok.com/@alina_revaa" aria-label="TikTok" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M16.5 3c.3 2.1 1.5 3.4 3.5 3.6v2.4c-1.2.1-2.3-.3-3.5-.9v5.7a5.7 5.7 0 1 1-5.7-5.7c.3 0 .6 0 .9.1v2.5a3.2 3.2 0 1 0 2.3 3V3h2.5z" />
            </svg>
          </a>
        </div>
      </section>

      <!-- ссылки + фото -->
      <section class="content">
        <!-- Впиши свои ссылки в href="..." -->
        <nav class="links">
          <a class="link" href="https://t.me/alina_revaa" target="_blank" rel="noopener">
            <span class="ic">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M21.8 4.3 2.9 11.6c-.9.4-.9 1.6.1 1.9l4.7 1.5 1.8 5.6c.2.7 1.1.9 1.6.3l2.6-2.6 4.7 3.5c.7.5 1.6.1 1.8-.7l3-14.2c.2-1-.7-1.9-1.7-1.6zM9.7 14.3l8.2-5.1c.2-.1.4.2.2.4l-6.7 6.1c-.2.2-.4.5-.4.8l-.2 2.2-1.3-4.4z" />
              </svg>
            </span>
            <span class="label">Telegram — канал ❤️</span>
            <span class="arrow">↗</span>
          </a>

          <a class="link" href="https://open.spotify.com/artist/0GAwvVJiuvm8PP4bqYXbYx" target="_blank" rel="noopener">
            <span class="ic">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.6 14.4a.62.62 0 0 1-.86.21c-2.35-1.44-5.3-1.76-8.79-.96a.63.63 0 0 1-.28-1.22c3.8-.87 7.08-.5 9.72 1.11.29.18.38.57.21.86zm1.23-2.74a.78.78 0 0 1-1.07.26c-2.69-1.65-6.79-2.13-9.97-1.17a.78.78 0 1 1-.45-1.49c3.63-1.1 8.15-.56 11.24 1.33.36.22.48.7.25 1.07zm.1-2.85C14.83 8.98 9.4 8.8 6.3 9.74a.94.94 0 1 1-.54-1.8c3.56-1.08 9.56-.87 13.33 1.37a.94.94 0 0 1-.96 1.61z" />
              </svg>
            </span>
            <span class="label">Spotify</span>
            <span class="arrow">↗</span>
          </a>

          <a class="link" href="https://music.apple.com/kg/artist/alina-reva/1663985860" target="_blank" rel="noopener">
            <span class="ic">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M17 3.5c-.4 0-8 1.7-8 1.7-.5.1-.8.5-.8 1v9.1A3 3 0 1 0 9.7 19V9l6.5-1.4v5.6A3 3 0 1 0 17.4 16V4.5c0-.6-.5-1.1-1.1-1z" />
              </svg>
            </span>
            <span class="label">Apple Music</span>
            <span class="arrow">↗</span>
          </a>

          <a class="link" href="https://music.youtube.com/@alina_revaa" target="_blank" rel="noopener">
            <span class="ic">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 15.5A5.5 5.5 0 1 1 12 6.5a5.5 5.5 0 0 1 0 11zM10 9.2l4.5 2.8L10 14.8V9.2z" />
              </svg>
            </span>
            <span class="label">YouTube Music</span>
            <span class="arrow">↗</span>
          </a>

          <!-- Раскрывающаяся кнопка: другие площадки -->
          <div class="more">
            <button class="link more-btn" type="button" aria-expanded="false" aria-controls="more-list">
              <span class="ic">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 13v-1a8 8 0 0 1 16 0v1" />
                  <rect x="2.5" y="13" width="4" height="7" rx="2" fill="currentColor" stroke="none" />
                  <rect x="17.5" y="13" width="4" height="7" rx="2" fill="currentColor" stroke="none" />
                </svg>
              </span>
              <span class="label">Слушать на других платформах</span>
              <span class="chevron">⌄</span>
            </button>

            <!-- Доп. список. Впиши свои ссылки в href="..."; строки без ссылки
                 (href="#") можно удалить. -->
            <div class="more-list" id="more-list">
              <div class="more-inner">
                <a class="sub-link" href="#" target="_blank" rel="noopener">
                  <span class="label">Deezer</span><span class="arrow">↗</span>
                </a>
                <a class="sub-link" href="#" target="_blank" rel="noopener">
                  <span class="label">Amazon Music</span><span class="arrow">↗</span>
                </a>
                <a class="sub-link" href="#" target="_blank" rel="noopener">
                  <span class="label">SoundCloud</span><span class="arrow">↗</span>
                </a>
                <a class="sub-link" href="#" target="_blank" rel="noopener">
                  <span class="label">Яндекс Музыка</span><span class="arrow">↗</span>
                </a>
                <a class="sub-link" href="#" target="_blank" rel="noopener">
                  <span class="label">Tidal</span><span class="arrow">↗</span>
                </a>
              </div>
            </div>
          </div>
        </nav>

        <!-- ФОТО-ГАЛЕРЕЯ: положи фото в папку photos/ с именами 1.jpg … 6.jpg.
             Пока файла нет — показывается заглушка с иконкой. -->
        <section class="gallery" aria-label="Фотографии">
          <a class="photo" href="photos/1.jpg" target="_blank" rel="noopener"><img src="photos/1.jpg" alt="" loading="lazy" onerror="this.remove()" /></a>
          <a class="photo" href="photos/2.jpg" target="_blank" rel="noopener"><img src="photos/2.jpg" alt="" loading="lazy" onerror="this.remove()" /></a>
          <a class="photo" href="photos/3.jpg" target="_blank" rel="noopener"><img src="photos/3.jpg" alt="" loading="lazy" onerror="this.remove()" /></a>
          <a class="photo" href="photos/4.jpg" target="_blank" rel="noopener"><img src="photos/4.jpg" alt="" loading="lazy" onerror="this.remove()" /></a>
          <a class="photo" href="photos/5.jpg" target="_blank" rel="noopener"><img src="photos/5.jpg" alt="" loading="lazy" onerror="this.remove()" /></a>
          <a class="photo" href="photos/6.jpg" target="_blank" rel="noopener"><img src="photos/6.jpg" alt="" loading="lazy" onerror="this.remove()" /></a>
        </section>
      </section>
    </main>

    <footer class="foot">© <span id="year"></span> alina reva</footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();

      // раскрытие/скрытие списка других платформ
      const moreBtn = document.querySelector(".more-btn");
      const moreList = document.getElementById("more-list");
      moreBtn.addEventListener("click", () => {
        const open = moreBtn.getAttribute("aria-expanded") === "true";
        moreBtn.setAttribute("aria-expanded", String(!open));
        moreList.classList.toggle("open", !open);
      });
    </script>
  </body>
</html>
