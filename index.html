    <!-- Лайтбокс: фото открывается поверх страницы (только на десктопе) -->
    <div class="lightbox" id="lightbox" aria-hidden="true">
      <button class="lightbox-close" aria-label="Закрыть">×</button>
      <img src="" alt="" />
    </div>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();

      // раскрытие/скрытие списка других платформ
      const moreBtn = document.querySelector(".more-btn");
      const moreList = document.getElementById("more-list");
      moreBtn.addEventListener("click", () => {
        const open = moreBtn.getAttribute("aria-expanded") === "true";
        moreBtn.setAttribute("aria-expanded", String(!open));
        moreList.classList.toggle("open", !open);
      });

      // Галерея: на компе фото открывается в лайтбоксе поверх страницы;
      // на телефоне (узкий экран) — не открывается вообще.
      const lightbox = document.getElementById("lightbox");
      const lightboxImg = lightbox.querySelector("img");
      const isDesktop = () => window.matchMedia("(min-width: 720px)").matches;

      document.querySelectorAll(".photo").forEach((a) => {
        a.addEventListener("click", (e) => {
          e.preventDefault(); // никогда не уходим на другую вкладку/страницу
          if (!isDesktop()) return; // на мобиле фото не открываются
          lightboxImg.src = a.getAttribute("href");
          lightbox.classList.add("open");
          lightbox.setAttribute("aria-hidden", "false");
        });
      });

      function closeLightbox() {
        lightbox.classList.remove("open");
        lightbox.setAttribute("aria-hidden", "true");
        lightboxImg.src = "";
      }
      lightbox.addEventListener("click", closeLightbox);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeLightbox();
      });
    </script>
